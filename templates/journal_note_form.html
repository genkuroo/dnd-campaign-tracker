{% extends "base.html" %}
{% block content %}
  <div class="page-head"><h1>{{ title }}</h1></div>
  {% if folder %}<p class="muted breadcrumb">in <a href="{{ url_for('journal_folder', folder_id=folder['id']) }}">📓 {{ folder['title'] }}</a></p>{% endif %}

  <form method="post" class="entity-form"
        action="{{ url_for('journal_note_edit', note_id=note['id']) if note else url_for('journal_note_new', folder_id=folder['id']) }}">
    <fieldset>
      <label class="field grow">
        <span>Title</span>
        <input type="text" name="title" value="{{ note['title'] if note else '' }}"
               placeholder="Session 4 — the escape from the cave" required autofocus>
      </label>
      <label class="field grow">
        <span>Note</span>
        <textarea name="body" rows="14" placeholder="Write what happened…">{{ note['body'] if note else '' }}</textarea>
      </label>
      <div class="field">
        <span>Visibility</span>
        <div class="radio-row">
          <label class="radio"><input type="radio" name="visibility" value="private"
            {{ 'checked' if not note or note['visibility'] != 'shared' else '' }}> Private <span class="muted">(only you{{ ' + DM' if not is_dm else '' }})</span></label>
          <label class="radio"><input type="radio" name="visibility" value="shared"
            {{ 'checked' if note and note['visibility'] == 'shared' else '' }}> Shared with the party</label>
        </div>
      </div>
    </fieldset>
    <div class="form-actions">
      <button type="submit" class="btn">{{ 'Save' if note else 'Save note' }}</button>
      <a class="btn-ghost" href="{{ url_for('journal_note', note_id=note['id']) if note else url_for('journal_folder', folder_id=folder['id']) }}">Cancel</a>
    </div>
  </form>
{% endblock %}
