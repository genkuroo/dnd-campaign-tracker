{% extends "base.html" %}
{% block content %}
  <div class="page-head">
    <h1 class="sheet-name">{{ combat['name'] }}</h1>
    <div class="head-actions">
      <a class="btn-ghost" href="{{ url_for('combat') }}">← All combats</a>
    </div>
  </div>

  <div id="combat">
    {% include "_combat_body.html" %}
  </div>

  <script>
    // Combat tracker: every action inside #combat (turn, initiative, damage/heal,
    // temp HP, conditions, add/remove, rests) re-renders just this fragment via
    // fetch — no full-page reload, so the tracker stays put during a fast fight.
    // Handlers are delegated on #combat, so they survive the fragment being
    // replaced. Forms marked data-full (End combat) navigate normally instead.
    // Without JS, every form POSTs and the server redirects — a clean fallback.
    (function () {
      const box = document.getElementById('combat');
      if (!box) return;

      // Subtabs (Tracker / Log). The active pane is kept in a closure var so it
      // survives the fragment being re-rendered by an AJAX action, and applied
      // after every swap. Tab buttons + panes both carry data-pane.
      let activePane = 'tracker';
      function applyPane() {
        box.querySelectorAll('.combat-tab').forEach(t =>
          t.classList.toggle('is-active', t.dataset.pane === activePane));
        box.querySelectorAll('.combat-pane').forEach(p =>
          p.classList.toggle('is-active', p.dataset.pane === activePane));
      }
      box.addEventListener('click', function (e) {
        const tab = e.target.closest('.combat-tab');
        if (!tab) return;
        activePane = tab.dataset.pane;
        applyPane();
      });
      box.classList.add('has-tabs');  // enables the tab/pane CSS (no-JS shows both)
      applyPane();

      box.addEventListener('submit', function (e) {
        const form = e.target.closest('form');
        if (!form || form.hasAttribute('data-full')) return;  // let full-nav forms through
        e.preventDefault();
        if (form.dataset.confirm && !window.confirm(form.dataset.confirm)) return;
        // FormData(form, submitter) keeps the clicked button's value (e.g. the
        // damage-vs-heal mode), which a plain FormData(form) would drop.
        fetch(form.getAttribute('action'), { method: 'POST', body: new FormData(form, e.submitter),
                             headers: { 'X-Requested-With': 'fetch' } })
          .then(r => r.text())
          .then(html => { box.innerHTML = html; applyPane(); });
      });
    })();
  </script>
{% endblock %}
