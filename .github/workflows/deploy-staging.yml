name: Deploy to staging

# On every push to main: run the test suite, and only on success, redeploy
# dnd-staging on the Pi. See docs/CICD_PLAN.md for the full pipeline plan
# this is step 4 of (promotion to prod is still a manual, separate step).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest

  deploy-staging:
    needs: test
    runs-on: ubuntu-latest
    steps:
      # Temporarily joins this runner to the tailnet for the job only
      # (ephemeral) -- the Pi has no public SSH and no port-forwarding, so
      # this is the only way a GitHub-hosted runner can reach it at all.
      # The OAuth client is scoped to tag:ci-deploy (see the tailnet policy
      # file); the real access boundary, though, is the deploy key below.
      - name: Connect to tailnet
        # Pinned to v4, not v3: v3 passes the OAuth secret directly as a raw
        # `tailscale up --authkey=` value, which silently never worked (its
        # retry loop has no exit-1 on exhausting retries, so the step
        # reported success regardless). v4 does a proper OAuth token exchange.
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci-deploy
          statedir: /tmp/tailscale-state
          # Peer propagation across the tailnet is eventually consistent --
          # this makes the action itself wait for the Pi to actually accept
          # a connection before the step finishes, rather than assuming the
          # first attempt lands.
          ping: 100.67.117.118

      # DEPLOY_SSH_KEY is restricted server-side (authorized_keys forced
      # command) to running scripts/deploy-staging.sh and nothing else --
      # even a fully leaked key can't open an interactive shell on the Pi.
      # PI_KNOWN_HOSTS is the Pi's public host key (not sensitive), pinned
      # so this connects to a verified host rather than disabling the check.
      - name: Deploy dnd-staging
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          PI_KNOWN_HOSTS: ${{ vars.PI_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$PI_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          # By IP, not the MagicDNS name -- the runner's resolver doesn't
          # pick up Tailscale's DNS even once connected. No retry loop
          # needed here: Connect to tailnet's own `ping` input already
          # blocks until the Pi is confirmed reachable, so by this point
          # the eventual-consistency race is already resolved.
          ssh -i ~/.ssh/deploy_key \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=15 \
              genkuro@100.67.117.118
